[project]
name = "theodore-voice-ai"
version = "1.0.0"
description = "Grounded Multilingual Telephony AI Assistant & Streaming Control System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "websockets>=13.1",
    "httpx>=0.27.2",
    "langgraph>=0.2.39",
    "langchain>=0.3.4",
    "langchain-core>=0.3.10",
    "langchain-google-genai>=2.0.1",
    "google-genai>=2.4.0",
    "langsmith>=0.1.137",
    "yt-dlp>=2024.10.22",
    "numpy>=2.1.2",
    "python-dotenv>=1.0.1",
    "greenlet>=3.5.6",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
python_files = ["test_*.py"]
