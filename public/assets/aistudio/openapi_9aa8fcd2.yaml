  # ─── UC4: Sprint Readiness Check ───
  /automated-notification-service/api/v1/sprint-readiness/trigger:
    get:
      summary: Trigger sprint readiness check
      description: |
        Triggers the sprint readiness check for all projects.
        Normally invoked by the scheduler at 4:30 AM UTC every Wednesday.

        Process Flow:
        1. Identifies current, next, and following sprints per project using ranked sprint query
        2. Calculates baseline from current sprint total story points
        3. Fetches future sprint metrics with gap detection:
           - Total items and story points per future sprint
           - Count of issues with missing/empty story points
           - Count of issues in Draft status
        4. Next sprint evaluation (+-20% threshold):
           - PASS: story points within [baseline x 0.80, baseline x 1.20]
           - FAIL: outside range, calculates deficit
        5. Following sprint evaluation (>=50% threshold):
           - PASS: story points >= baseline x 0.50
           - FAIL: below minimum required
        6. Renders sprint_readiness_next and sprint_readiness_following Adaptive Cards → sends to project chat
        7. Escalation check — fires only when BOTH conditions are true:
           - Next sprint FAILS its threshold
           - Next sprint starts next week
           Then resolves specialization, sends escalation card with @mention to escalation chat
        8. Logs all outcomes to notification_logs

        Edge cases:
        - No future sprints: reports "No upcoming sprints found"
        - Only one future sprint: evaluates next only
        - Future sprint has 0 issues: reports 0 SP, will breach threshold
        - Baseline is 0 SP: skips threshold comparison, reports as informational
      operation_id: triggerSprintReadiness
      tags:
        - Sprint Readiness
      security:
        - bearer_auth: []
        - jira_account_id: []
      responses:
        '200':
          description: Sprint readiness process started
          content:
