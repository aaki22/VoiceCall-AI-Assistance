                    request_id: "req-7f3a9b2c-4d1e-4a8f-9c5b-6e2d8f1a3b4c"

  # ─── UC3: Sprint Progress Update ───
  /automated-notification-service/api/v1/sprint-progress/trigger:
    get:
      summary: Trigger sprint progress notification
      description: |
        Triggers the sprint progress update for all projects with active sprints.
        Normally invoked by the scheduler at 8:30 AM UTC on Tuesday and Thursday.

        Process Flow:
        1. Bulk-queries sprint metrics across all projects with active sprints:
           - Total/completed issues and story points
           - Expected SP by today (issues with due_date <= today)
           - Completed SP by today (done issues with due_date <= today)
           - Status breakdown: not started, in progress
           - Open risks/bugs count (issue_type in Bug, Risk, Issue, Impediment and not done)
        2. Queries overdue stories per project (due_date <= today AND status not done)
        3. Calculates sprint-level spillover risk by comparing expected vs actual daily rate:
           - First week (lenient): High if 40%+ below, Medium if 20-40% below, Low otherwise
           - Second week (aggressive): High if 20%+ below, Medium if 0-20% below, Low otherwise
        4. Resolves project leads (Tech Lead, Delivery Lead, PM) for @mentions
        5. Renders sprint_progress Adaptive Card from notification_templates
        6. Batch-sends to project Teams chats (50 concurrent) with lead @mentions
        7. Logs each send/skip/fail to notification_logs

        Skips a project when:
        - No Teams chat mapping found
        - No active sprint
        - sprint_progress_enabled = false on the mapping
      operation_id: triggerSprintProgress
      tags:
        - Sprint Progress
      security:
        - bearer_auth: []
        - jira_account_id: []
      responses:
        '200':
          description: Sprint progress process started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Sprint progress notification process has been started"
                  data:
                    type: object
                    nullable: true
                  errors:
                    type: array
                    items:
                      type: object
                    example: []
                  timestamp:
                    type: string
                    format: date-time
                    example: "2024-02-27T14:00:45.123Z"
                  request_id:
                    type: string
                    format: uuid
                    example: "req-7f3a9b2c-4d1e-4a8f-9c5b-6e2d8f1a3b4c"
              examples:
                success:
                  summary: Sprint progress triggered
                  value:
                    status: "success"
                    code: 200
                    message: "Sprint progress notification process has been started"
                    data: null
                    errors: []
                    timestamp: "2024-02-27T14:00:45.123Z"
                    request_id: "req-7f3a9b2c-4d1e-4a8f-9c5b-6e2d8f1a3b4c"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  code:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: "Unauthorized"
                  data:
                    type: object
                    nullable: true
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        code:
                          type: string
                        message:
                          type: string
                  timestamp:
                    type: string
                    format: date-time
                  request_id:
                    type: string
                    format: uuid
              examples:
                unauthorized:
                  value:
                    status: "error"
                    code: 401
                    message: "Unauthorized"
                    data: null
                    errors:
                      - field: "Authorization"
                        code: "UNAUTHORIZED"
