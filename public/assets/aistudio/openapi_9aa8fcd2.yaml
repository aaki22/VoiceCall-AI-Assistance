                  code:
                    type: integer
                    example: 422
                  message:
                    type: string
                    example: "Validation Error"
                  data:
                    type: object
                    nullable: true
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        code:
                          type: string
                        message:
                          type: string
                  timestamp:
                    type: string
                    format: date-time
                  request_id:
                    type: string
                    format: uuid
              examples:
                not_delivery_type:
                  summary: Issue is not a Delivery type
                  value:
                    status: "error"
                    code: 422
                    message: "Validation Error"
                    data: null
                    errors:
                      - field: "issue_key"
                        code: "INVALID_ISSUE_TYPE"
                        message: "Only Delivery issue types are supported. Received: Story"
                    timestamp: "2024-02-26T10:30:45.123Z"
                    request_id: "req-7f3a9b2c-4d1e-4a8f-9c5b-6e2d8f1a3b4c"
                invalid_issue_key:
                  summary: Issue key format invalid
                  value:
