  /automated-notification-service/api/v1/mappings/project/teams:
    post:
      summary: Upsert project Teams chat mapping
      description: |
        Webhook-triggered endpoint that inserts or updates the Microsoft Teams chat/channel
        mapping for a given project in the project_teams_mappings table.

        Accepts Teams chat and channel links (URLs) in the request body. The service extracts
        the chat_id and channel_id from the URLs by parsing and URL-decoding the path segments.

        Behavior:
        - Looks up the project by jira_project_key in the projects table
        - Extracts teams_chat_id from teams_chat_link URL
        - Extracts teams_channel_id from teams_channel_link URL (if provided)
        - If no active mapping exists for the project → inserts a new record
        - If an active mapping already exists → updates the existing record
        - After upsert, automatically adds the service account to the Teams chat via Graph API

        Typically called by an external webhook (e.g. Forge app, admin tool) when a project's
        Teams chat link is configured or changed.
      operation_id: upsertProjectTeamsLink
      tags:
        - Mappings
      security:
        - bearer_auth: []
        - jira_account_id: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jira_project_key
                - teams_chat_link
              properties:
                jira_project_key:
                  type: string
                  description: Jira project key used to look up the project in the local DB.
                  example: "PROJ"
                teams_chat_link:
                  type: string
                  description: Full Microsoft Teams group chat URL. The service extracts the chat_id from this URL.
                  example: "https://teams.microsoft.com/l/chat/19%3Aabc123%40thread.v2/0?tenantId=xxx"
                teams_channel_link:
                  type: string
                  nullable: true
                  description: Full Microsoft Teams channel URL (optional). The service extracts the channel_id if provided.
                  example: "https://teams.microsoft.com/l/channel/19%3Achannel123%40thread.tacv2/General?groupId=xxx"
            examples:
