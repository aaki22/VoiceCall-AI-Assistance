openapi: 3.0.0
info:
  title: Automated Notification Service
  version: 1.0.0
  description: |
    API for the Jira → Microsoft Teams Notification System.
    Handles four use cases:
    - UC1: Daily Work Item & Delay Notification (scheduled 6:30 AM / 3:30 PM UTC)
    - UC2: Delivery Status Communication & Escalation (event-driven + polling fallback)
    - UC3: Sprint Progress Update (scheduled Tue/Thu 8:30 AM UTC)
    - UC4: Sprint Readiness Check (scheduled Wednesday 4:30 AM UTC)
  contact:
    name: Notification Service Team
    email: support@engineering-dashboard.com

servers:
  - url: "https://api.example.com/pma"

paths:
  # ─── Default Endpoints ───
  /healthCheck:
    get:
      summary: Health check
      description: |
        Liveness and readiness probe. Returns 200 if the service is running.
        This endpoint is intentionally unauthenticated for use by load balancers
        and container orchestration health probes (k8s, ECS).
      operation_id: healthCheck
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Service is healthy"
                  data:
                    type: object
                    properties:
                      checks:
                        type: object
                        properties:
                          server:
                            type: string
                            example: "ok"
                  errors:
                    type: array
                    items:
                      type: object
                    example: []
                  timestamp:
                    type: string
                    format: date-time
                    example: "2024-02-26T10:30:45.123Z"
                  request_id:
                    type: string
                    format: uuid
                    example: "req-7f3a9b2c-4d1e-4a8f-9c5b-6e2d8f1a3b4c"
              examples:
                success:
                  summary: Server is running
                  value:
                    status: "success"
                    code: 200
                    message: "Service is healthy"
                    data:
                      checks:
                        server: "ok"
                    errors: []
                    timestamp: "2024-02-26T10:30:45.123Z"
                    request_id: "req-7f3a9b2c-4d1e-4a8f-9c5b-6e2d8f1a3b4c"

  /docs:
    get:
      summary: API documentation
      description: Serves the RapiDoc API documentation UI for the notification service.
      operation_id: getApiDocs
      tags:
        - Health
      responses:
        '200':
          description: API documentation page (HTML)

  # ─── UC1: Daily Work Item & Delay Notification ───
  /automated-notification-service/api/v1/daily-notification/trigger:
    get:
      summary: Trigger daily work item notification
      description: |
        Triggers the daily work item notification for all projects.
        Normally invoked by the scheduler at 6:30 AM UTC (daily_start) and 3:30 PM UTC (daily_end).
        The service determines which notification type to send based on the current UTC time.

        Process Flow:
        1. Bulk-queries all active issues with start_date <= now and due_date >= today (or overdue)
           across all projects, excluding statuses: Done, Closed, Resolved, Blocked, On Hold, Waiting, Impediment
        2. Groups issues by project, then by engineer
        3. Classifies each issue as Delayed (due_date < today) / In Progress / Not Started
           using Jira status category mapping (new → Not Started, indeterminate → In Progress)
        4. Identifies untagged items not in the active sprint
        5. Renders Adaptive Card from notification_templates (template_key: daily_start or daily_end)
        6. Batch-sends to project Teams chats (50 concurrent) via Microsoft Graph API
        7. Logs each send/skip/fail to notification_logs

        Skips a project when:
        - No Teams chat mapping found
        - No active issues matching criteria
        - daily_notification_enabled = false on the mapping
      operation_id: triggerDailyNotification
      tags:
        - Daily Notification
      security:
        - bearer_auth: []
        - jira_account_id: []
      responses:
        '200':
          description: Daily notification process started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Daily notification process has been started"
                  data:
                    type: object
                    nullable: true
                  errors:
                    type: array
                    items:
                      type: object
                    example: []
                  timestamp:
                    type: string
                    format: date-time
                    example: "2024-02-26T13:00:45.123Z"
                  request_id:
                    type: string
                    format: uuid
                    example: "req-7f3a9b2c-4d1e-4a8f-9c5b-6e2d8f1a3b4c"
              examples:
                success:
                  summary: Daily notification triggered
                  value:
                    status: "success"
                    code: 200
                    message: "Daily notification process has been started"
                    data: null
                    errors: []
                    timestamp: "2024-02-26T13:00:45.123Z"
                    request_id: "req-7f3a9b2c-4d1e-4a8f-9c5b-6e2d8f1a3b4c"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  code:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: "Unauthorized"
                  data:
                    type: object
                    nullable: true
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        code:
                          type: string
                        message:
                          type: string
                  timestamp:
                    type: string
                    format: date-time
                  request_id:
                    type: string
                    format: uuid
              examples:
                unauthorized:
                  value:
                    status: "error"
                    code: 401
                    message: "Unauthorized"
                    data: null
                    errors:
                      - field: "Authorization"
                        code: "UNAUTHORIZED"
                        message: "Invalid or expired authentication token"
                    timestamp: "2024-02-26T13:00:45.123Z"
                    request_id: "req-7f3a9b2c-4d1e-4a8f-9c5b-6e2d8f1a3b4c"
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  code:
                    type: integer
                    example: 500
                  message:
                    type: string
                  data:
                    type: object
                    nullable: true
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        code:
                          type: string
                        message:
                          type: string
                  timestamp:
                    type: string
                    format: date-time
                  request_id:
                    type: string
                    format: uuid
              examples:
                server_error:
                  value:
                    status: "error"
                    code: 500
                    message: "Internal Error"
                    data: null
                    errors:
                      - field: "dailyNotification"
                        code: "INTERNAL_ERROR"
                        message: "An unexpected error occurred while processing daily notifications"
                    timestamp: "2024-02-26T13:00:45.123Z"
                    request_id: "req-7f3a9b2c-4d1e-4a8f-9c5b-6e2d8f1a3b4c"
        '502':
          description: Bad Gateway - Microsoft Graph API failure during notification sending
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  code:
                    type: integer
                    example: 502
                  message:
                    type: string
                    example: "Graph API Error"
                  data:
                    type: object
                    nullable: true
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        code:
                          type: string
                        message:
                          type: string
                  timestamp:
                    type: string
                    format: date-time
                  request_id:
                    type: string
                    format: uuid
              examples:
                graph_api_forbidden:
                  summary: Graph API returned 403 Forbidden
                  value:
                    status: "error"
                    code: 502
                    message: "Graph API Error"
                    data: null
                    errors:
                      - field: "graphApi"
                        code: "GRAPH_API_FORBIDDEN"
                        message: "The application is not part of the chat roster"
                    timestamp: "2024-02-26T13:00:45.123Z"
                    request_id: "req-7f3a9b2c-4d1e-4a8f-9c5b-6e2d8f1a3b4c"
                graph_api_rate_limited:
                  summary: Graph API returned 429 Too Many Requests
                  value:
                    status: "error"
                    code: 502
                    message: "Graph API Error"
                    data: null
                    errors:
                      - field: "graphApi"
                        code: "GRAPH_API_RATE_LIMITED"
                        message: "Rate limit exceeded after 3 retries"
                    timestamp: "2024-02-26T13:00:45.123Z"
                    request_id: "req-7f3a9b2c-4d1e-4a8f-9c5b-6e2d8f1a3b4c"
                graph_api_token_failure:
                  summary: Failed to acquire Graph API access token
                  value:
                    status: "error"
                    code: 502
                    message: "Graph API Error"
                    data: null
                    errors:
                      - field: "graphApi"
                        code: "GRAPH_API_TOKEN_ERROR"
                        message: "Failed to acquire access token from Azure AD"
                    timestamp: "2024-02-26T13:00:45.123Z"
                    request_id: "req-7f3a9b2c-4d1e-4a8f-9c5b-6e2d8f1a3b4c"

  # ─── UC2: Delivery Status Communication & Escalation ───
  /automated-notification-service/api/v1/delivery-notification/issue/{issue_key}:
    post:
      summary: Handle delivery work item event
      description: |
        Single endpoint called by Jira Automation rules for delivery work items.
        Determines the event type (created vs delayed) by inspecting the issue status.

        Jira Automation triggers:
        - Rule 1: Issue created with type = Delivery → calls this endpoint
        - Rule 2: Issue status changed to "Delayed" with type = Delivery → calls this endpoint

        Process Flow:
        1. Fetches fresh issue details from Jira REST API (GET /rest/api/3/issue/{issue_key})
           with fields: summary, status, project, issuetype, assignee
        2. Checks if issue exists in local DB and reads current status
        3. Determines event type:
           - created: issue not in DB, or exists but status != "Delayed"
           - delayed: issue exists in DB and status = "Delayed"
        4. Deduplication: checks notification_logs for same issue_key + notification_type within 5 minutes
        5. Resolves project Teams chat mapping from project_teams_mappings
        6. Created flow: Renders delivery_created Adaptive Card → sends to project chat
        7. Delayed flow:
           - Renders delivery_delayed_project card → sends to project chat
           - Resolves specialization via: issue custom field → assignee specialization → project primary_specialization_id
           - Looks up specialization_escalation_mappings for the escalation chat
           - Renders delivery_delayed_escalation card with @mention of specialization head → sends to escalation chat
        8. Logs all send/skip/fail outcomes to notification_logs

        Polling fallback: A separate scheduler runs every 15 minutes, queries delivery items
        created or changed to "Delayed" in the last 30 minutes that have no matching notification_logs
        entry, and processes them through the same flow internally.
      operation_id: handleDeliveryNotification
      tags:
        - Delivery Notification
      security:
        - bearer_auth: []
        - jira_account_id: []
      parameters:
        - name: issue_key
          in: path
          required: true
          description: |
            Jira issue key (e.g. "PROJ-123"). Passed by Jira Automation via {{issue.key}}.
          schema:
            type: string
            minLength: 1
            maxLength: 50
            example: "PROJ-123"
      responses:
        '200':
          description: Notification processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Delivery notification processed"
                  data:
                    type: object
                    properties:
                      event:
                        type: string
                        enum: [created, delayed]
                        example: "delayed"
                      issue_key:
                        type: string
                        example: "PROJ-123"
                      notifications_sent:
                        type: array
                        items:
                          type: object
                          properties:
                            notification_type:
                              type: string
                              enum: [delivery_created, delivery_delayed_project, delivery_delayed_escalation]
                            teams_chat_id:
                              type: string
                            status:
                              type: string
                              enum: [sent, failed, skipped]
                            error:
                              type: string
                              nullable: true
                  errors:
                    type: array
                    items:
                      type: object
                    example: []
                  timestamp:
                    type: string
                    format: date-time
                    example: "2024-02-26T10:30:45.123Z"
                  request_id:
                    type: string
                    format: uuid
                    example: "req-7f3a9b2c-4d1e-4a8f-9c5b-6e2d8f1a3b4c"
              examples:
                created:
                  summary: Delivery item created notification sent
                  value:
                    status: "success"
                    code: 200
                    message: "Delivery notification processed"
                    data:
                      event: "created"
                      issue_key: "PROJ-123"
                      notifications_sent:
                        - notification_type: "delivery_created"
                          teams_chat_id: "19:abc123@thread.v2"
                          status: "sent"
                          error: null
                    errors: []
                    timestamp: "2024-02-26T10:30:45.123Z"
                    request_id: "req-7f3a9b2c-4d1e-4a8f-9c5b-6e2d8f1a3b4c"
                delayed:
                  summary: Delivery item delayed — project chat + escalation
                  value:
                    status: "success"
                    code: 200
                    message: "Delivery notification processed"
                    data:
                      event: "delayed"
                      issue_key: "PROJ-123"
                      notifications_sent:
                        - notification_type: "delivery_delayed_project"
                          teams_chat_id: "19:abc123@thread.v2"
                          status: "sent"
                          error: null
                        - notification_type: "delivery_delayed_escalation"
                          teams_chat_id: "19:esc456@thread.v2"
                          status: "sent"
                          error: null
                    errors: []
                    timestamp: "2024-02-26T10:30:45.123Z"
                    request_id: "req-7f3a9b2c-4d1e-4a8f-9c5b-6e2d8f1a3b4c"
                skipped_duplicate:
                  summary: Duplicate notification skipped
                  value:
                    status: "success"
                    code: 200
                    message: "Delivery notification skipped"
                    data:
                      event: null
                      issue_key: "PROJ-123"
                      skip_reason: "duplicate"
                      notifications_sent: []
                    errors: []
                    timestamp: "2024-02-26T10:30:45.123Z"
                    request_id: "req-7f3a9b2c-4d1e-4a8f-9c5b-6e2d8f1a3b4c"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  code:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: "Bad Request"
                  data:
                    type: object
                    nullable: true
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        code:
                          type: string
                        message:
                          type: string
                  timestamp:
                    type: string
                    format: date-time
                  request_id:
                    type: string
                    format: uuid
              examples:
                bad_request:
                  value:
                    status: "error"
                    code: 400
                    message: "Bad Request"
                    data: null
                    errors:
                      - field: "issue_key"
                        code: "INVALID_PARAMETER"
                        message: "Invalid issue_key format"
                    timestamp: "2024-02-26T10:30:45.123Z"
                    request_id: "req-7f3a9b2c-4d1e-4a8f-9c5b-6e2d8f1a3b4c"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  code:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: "Unauthorized"
                  data:
                    type: object
                    nullable: true
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        code:
                          type: string
                        message:
                          type: string
                  timestamp:
                    type: string
                    format: date-time
                  request_id:
                    type: string
                    format: uuid
              examples:
                unauthorized:
                  value:
                    status: "error"
                    code: 401
                    message: "Unauthorized"
                    data: null
                    errors:
                      - field: "Authorization"
                        code: "UNAUTHORIZED"
                        message: "Invalid or expired authentication token"
                    timestamp: "2024-02-26T10:30:45.123Z"
                    request_id: "req-7f3a9b2c-4d1e-4a8f-9c5b-6e2d8f1a3b4c"
        '404':
          description: Issue not found in Jira
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  code:
                    type: integer
                    example: 404
                  message:
                    type: string
                    example: "Not Found"
                  data:
                    type: object
                    nullable: true
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        code:
                          type: string
                        message:
                          type: string
                  timestamp:
                    type: string
                    format: date-time
                  request_id:
                    type: string
                    format: uuid
              examples:
                not_found:
                  value:
                    status: "error"
                    code: 404
                    message: "Not Found"
                    data: null
                    errors:
                      - field: "issue_key"
                        code: "ISSUE_NOT_FOUND"
                        message: "Issue PROJ-123 not found in Jira"
                    timestamp: "2024-02-26T10:30:45.123Z"
                    request_id: "req-7f3a9b2c-4d1e-4a8f-9c5b-6e2d8f1a3b4c"
        '422':
          description: Unprocessable Entity - issue validation failed
          content:
